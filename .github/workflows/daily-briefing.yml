name: Daily Revenue Briefing
on:
  schedule:
    - cron: '0 7 * * 2-6'  # 3:00 AM ET (UTC-4 EDT), Tue–Sat
  workflow_dispatch:
jobs:
  post-briefings:
    runs-on: ubuntu-latest
    steps:
      - name: Post Daily Pipe Update with QMH
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          pip install pytz --quiet
          python3 - <<'EOF'
          import urllib.request, urllib.parse, json, os, datetime, pytz, time
          HUBSPOT_KEY   = os.environ["HUBSPOT_API_KEY"]
          SLACK_TOKEN   = os.environ["SLACK_BOT_TOKEN"]
          SLACK_CHANNEL = "C0APDRMLN1Z"  # #daily-sales
          SLACK_USER    = "U08JJMM2QSW"
          PORTAL_ID     = "21451281"

          # ── Rep roster & buckets ──────────────────────────────────
          # AE_BUCKETS is the only source of truth for who is Legal vs Core.
          # QMH attribution is by CONTACT owner (mirrors the HubSpot dashboard),
          # not meeting owner.
          AE_BUCKETS = {
              "Dillon DeWitt":      "Legal",
              "Will Weis":          "Legal",
              "James Gregory":      "Legal",
              "Mike Merritts":      "Legal",
              "Isabella Simpatico": "Core",
          }
          SELLERS = list(AE_BUCKETS.keys())

          HS_HEADERS    = {"Authorization": f"Bearer {HUBSPOT_KEY}", "Content-Type": "application/json"}
          SLACK_HEADERS = {"Authorization": f"Bearer {SLACK_TOKEN}", "Content-Type": "application/json"}

          # ── Date ranges ───────────────────────────────────────────
          et        = pytz.timezone("America/New_York")
          now_et    = datetime.datetime.now(et)
          yesterday = now_et - datetime.timedelta(days=1)
          # Yesterday window (for daily deals + daily QMH)
          start_et  = et.localize(datetime.datetime(yesterday.year, yesterday.month, yesterday.day, 0, 0, 0))
          end_et    = et.localize(datetime.datetime(yesterday.year, yesterday.month, yesterday.day, 23, 59, 59))
          start_ms  = int(start_et.timestamp() * 1000)
          end_ms    = int(end_et.timestamp() * 1000)
          date_label = yesterday.strftime("%A, %B %d, %Y")
          # MTD window (for QMH MTD)
          mtd_start = et.localize(datetime.datetime(now_et.year, now_et.month, 1, 0, 0, 0))
          mtd_start_ms = int(mtd_start.timestamp() * 1000)
          now_ms    = int(now_et.timestamp() * 1000)

          # ── HubSpot helpers ────────────────────────────────────────
          def hs_get(path):
              req = urllib.request.Request(f"https://api.hubapi.com{path}", headers=HS_HEADERS)
              with urllib.request.urlopen(req) as r: return json.loads(r.read())

          def hs_post(path, payload):
              data = json.dumps(payload).encode()
              req  = urllib.request.Request(
                  f"https://api.hubapi.com{path}",
                  data=data, headers=HS_HEADERS, method="POST")
              with urllib.request.urlopen(req) as r: return json.loads(r.read())

          def hs_post_all(path, payload, limit=100):
              """Paginate through all results."""
              all_results = []
              offset = 0
              while True:
                  payload["limit"]  = limit
                  payload["after"]  = offset
                  resp = hs_post(path, payload)
                  results = resp.get("results", [])
                  all_results.extend(results)
                  paging = resp.get("paging", {}).get("next", {})
                  offset = paging.get("after")
                  if not offset or len(results) < limit:
                      break
              return all_results

          # ── Get owners ─────────────────────────────────────────────
          owners     = hs_get("/crm/v3/owners").get("results", [])
          owner_map  = {f"{o['firstName']} {o['lastName']}": o["id"] for o in owners}
          id_to_name = {o["id"]: f"{o['firstName']} {o['lastName']}" for o in owners}
          seller_ids = {name: owner_map.get(name) for name in SELLERS}
          print(f"Seller IDs: {seller_ids}")
          missing = [s for s, sid in seller_ids.items() if not sid]
          if missing:
              print(f"⚠️ Could not resolve HubSpot owner IDs for: {missing}")

          # ── Fetch yesterday's deals ────────────────────────────────
          deals = hs_post("/crm/v3/objects/deals/search", {
              "filterGroups": [{"filters": [
                  {"propertyName": "hs_createdate", "operator": "GTE", "value": str(start_ms)},
                  {"propertyName": "hs_createdate", "operator": "LTE", "value": str(end_ms)},
                  {"propertyName": "pipeline",      "operator": "EQ",  "value": "default"},
              ]}],
              "properties": ["dealname", "dealtype", "icp", "amount", "closedate",
                             "dealstage", "hubspot_owner_id", "hs_createdate"],
              "limit": 100
          }).get("results", [])

          # ── Helpers ────────────────────────────────────────────────
          def fmt_currency(val):
              try: return f"${float(val):,.0f}"
              except: return "$0"

          def fmt_date(iso):
              if not iso: return "—"
              try:
                  d = datetime.datetime.fromisoformat(iso.replace("Z", "+00:00"))
                  return d.strftime("%b %d, %Y")
              except: return iso

          # ── Map deals to sellers (by deal owner) ───────────────────
          seller_deals = {s: [] for s in SELLERS}
          for deal in deals:
              p   = deal.get("properties", {})
              oid = p.get("hubspot_owner_id")
              for name, sid in seller_ids.items():
                  if str(oid) == str(sid):
                      seller_deals[name].append({**p, "hs_object_id": deal["id"]})
          total_deals = sum(len(v) for v in seller_deals.values())
          total_acv   = sum(float(d.get("amount") or 0) for v in seller_deals.values() for d in v)
          acv_vals    = [sum(float(d.get("amount") or 0) for d in seller_deals[s]) for s in SELLERS]
          short_names = [s.split()[0] for s in SELLERS]

          # ── Fetch QMH meetings ────────────────────────────────────
          # HubSpot's internal value for the "Held Qualified" outcome is uppercase
          # ("HELD QUALIFIED") even though the UI displays title case.
          def fetch_qmh_meetings(start_ms, end_ms):
              return hs_post_all("/crm/v3/objects/meetings/search", {
                  "filterGroups": [{"filters": [
                      {"propertyName": "hs_meeting_outcome",  "operator": "EQ",  "value": "HELD QUALIFIED"},
                      {"propertyName": "hs_activity_type",    "operator": "EQ",  "value": "Intro/Discovery"},
                      {"propertyName": "hs_meeting_end_time", "operator": "GTE", "value": str(start_ms)},
                      {"propertyName": "hs_meeting_end_time", "operator": "LTE", "value": str(end_ms)},
                  ]}],
                  "properties": ["hs_meeting_outcome", "hs_activity_type",
                                 "hs_meeting_end_time", "hubspot_owner_id"],
              })

          # ── Map each meeting → its contact owner ──────────────────
          # Mirrors the HubSpot Legal QMH dashboard's "Contact owner"
          # dimension. For each meeting:
          #   1) Get associated contacts (batch)
          #   2) Take the first associated contact
          #   3) Look up that contact's hubspot_owner_id (batch)
          # Caches results across calls so daily + MTD don't re-fetch.
          meeting_contact_owner_cache = {}  # meeting_id -> owner_id (or "")

          def hydrate_meeting_contact_owners(meeting_ids):
              uncached = [str(mid) for mid in meeting_ids if str(mid) not in meeting_contact_owner_cache]
              if not uncached:
                  return

              # Step 1: meeting → contacts associations (batched)
              meeting_to_first_contact = {}
              for i in range(0, len(uncached), 100):
                  batch = uncached[i:i+100]
                  try:
                      resp = hs_post(
                          "/crm/v3/associations/meetings/contacts/batch/read",
                          {"inputs": [{"id": mid} for mid in batch]}
                      )
                  except Exception as e:
                      print(f"  ⚠️ meeting→contact assoc error: {e}")
                      continue
                  for r in resp.get("results", []):
                      mid = str(r.get("from", {}).get("id", ""))
                      tos = r.get("to", [])
                      if mid and tos:
                          meeting_to_first_contact[mid] = str(tos[0].get("id", ""))
                  time.sleep(0.2)

              # Initialize empty for every meeting we asked about (handles no-contact case)
              for mid in uncached:
                  meeting_contact_owner_cache[mid] = ""

              # Step 2: batch-fetch contact owners
              unique_cids = list({c for c in meeting_to_first_contact.values() if c})
              cid_to_owner = {}
              for j in range(0, len(unique_cids), 100):
                  cid_batch = unique_cids[j:j+100]
                  try:
                      resp = hs_post(
                          "/crm/v3/objects/contacts/batch/read",
                          {"inputs": [{"id": cid} for cid in cid_batch],
                           "properties": ["hubspot_owner_id"]}
                      )
                  except Exception as e:
                      print(f"  ⚠️ contact batch read error: {e}")
                      continue
                  for c in resp.get("results", []):
                      owner = (c.get("properties", {}).get("hubspot_owner_id") or "")
                      cid_to_owner[c["id"]] = owner
                  time.sleep(0.2)

              # Step 3: roll up meeting → contact owner
              for mid, cid in meeting_to_first_contact.items():
                  meeting_contact_owner_cache[mid] = cid_to_owner.get(cid, "")

          # ── Build per-AE QMH counts (by contact owner) ────────────
          def build_qmh_counts(meetings):
              hydrate_meeting_contact_owners([m["id"] for m in meetings])
              counts = {s: 0 for s in SELLERS}
              for m in meetings:
                  contact_owner_id = meeting_contact_owner_cache.get(str(m["id"]), "")
                  owner_name       = id_to_name.get(contact_owner_id, "")
                  if owner_name in SELLERS:
                      counts[owner_name] += 1
              return counts

          print("Fetching daily QMH meetings...")
          daily_meetings = fetch_qmh_meetings(start_ms, end_ms)
          print(f"Daily QMH meetings found (pre-attribution): {len(daily_meetings)}")
          daily_qmh = build_qmh_counts(daily_meetings)

          print("Fetching MTD QMH meetings...")
          mtd_meetings = fetch_qmh_meetings(mtd_start_ms, now_ms)
          print(f"MTD QMH meetings found (pre-attribution): {len(mtd_meetings)}")
          mtd_qmh = build_qmh_counts(mtd_meetings)

          # Bucket totals
          def bucket_total(counts, bucket):
              return sum(c for s, c in counts.items() if AE_BUCKETS.get(s) == bucket)

          daily_legal_total = bucket_total(daily_qmh, "Legal")
          daily_core_total  = bucket_total(daily_qmh, "Core")
          mtd_legal_total   = bucket_total(mtd_qmh,   "Legal")
          mtd_core_total    = bucket_total(mtd_qmh,   "Core")
          print(f"Daily — Legal: {daily_legal_total} | Core: {daily_core_total} | "
                f"unattributed (no SELLER contact owner): "
                f"{len(daily_meetings) - sum(daily_qmh.values())}")
          print(f"MTD   — Legal: {mtd_legal_total} | Core: {mtd_core_total} | "
                f"unattributed (no SELLER contact owner): "
                f"{len(mtd_meetings) - sum(mtd_qmh.values())}")

          # ── Build Slack message ───────────────────────────────────
          msg  = f"<@{SLACK_USER}>\n"
          msg += f"*📊 Daily Pipe Update — {date_label}*\n"
          msg += f"*{total_deals} new deal{'s' if total_deals != 1 else ''} | Total ACV: {fmt_currency(total_acv)}*\n\n"

          # Deal details per seller
          for seller in SELLERS:
              sd = seller_deals[seller]
              if not sd:
                  msg += f"*{seller}* — 0 deals\n\n"
              else:
                  acv = sum(float(d.get("amount") or 0) for d in sd)
                  msg += f"*{seller}* — {len(sd)} deal(s) | *ACV: {fmt_currency(acv)}*\n"
                  for d in sd:
                      did   = d.get("hs_object_id", "")
                      name  = d.get("dealname", "Unnamed Deal")
                      amt   = fmt_currency(d.get("amount"))
                      icp   = d.get("icp") or "—"
                      dtype = d.get("dealtype") or "—"
                      close = fmt_date(d.get("closedate"))
                      url   = f"https://app.hubspot.com/contacts/{PORTAL_ID}/record/0-3/{did}"
                      msg  += f"<{url}|{name}>\n{amt} | ICP: {icp} | {dtype} | Close: {close}\n"
                  msg += "\n"

          # ACV chart
          msg += "```\n"
          msg += f"{'Rep':<12} {'ACV':>10}  Chart\n"
          msg += "─" * 45 + "\n"
          max_acv = max(acv_vals) if max(acv_vals) > 0 else 1
          for name, val in zip(short_names, acv_vals):
              bar = "█" * int((val / max_acv) * 20)
              msg += f"{name:<12} {fmt_currency(val):>10}  {bar}\n"
          msg += "```\n\n"

          # ── QMH helper: render a contact-owner table ──────────────
          def render_qmh_table(counts):
              max_count = max(counts.values()) if max(counts.values()) > 0 else 1
              lines = ["```"]
              lines.append(f"{'Rep':<12} {'Bucket':<8} {'QMH':>4}  Chart")
              lines.append("─" * 50)
              for s in SELLERS:
                  short  = s.split()[0]
                  bucket = AE_BUCKETS.get(s, "—")
                  count  = counts[s]
                  bar    = "█" * int((count / max_count) * 15)
                  lines.append(f"{short:<12} {bucket:<8} {count:>4}  {bar}")
              lines.append("```")
              return "\n".join(lines)

          # QMH — Yesterday
          msg += f"*🤝 QMH — Yesterday (Intro/Discovery · Held Qualified · by contact owner)*\n"
          msg += f"*Legal: {daily_legal_total}  ·  Core: {daily_core_total}  ·  Total: {daily_legal_total + daily_core_total}*\n"
          msg += render_qmh_table(daily_qmh) + "\n\n"

          # QMH — MTD
          msg += f"*📅 QMH — MTD (Month to Date · by contact owner)*\n"
          msg += f"*Legal: {mtd_legal_total}  ·  Core: {mtd_core_total}  ·  Total: {mtd_legal_total + mtd_core_total}*\n"
          msg += render_qmh_table(mtd_qmh) + "\n"

          # ── Post to Slack ──────────────────────────────────────────
          payload = {"channel": SLACK_CHANNEL, "text": msg}
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps(payload).encode(),
              headers=SLACK_HEADERS, method="POST")
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
              if result.get("ok"):
                  print("✅ Daily Pipe Update + QMH posted!")
              else:
                  print(f"⚠️ Slack error: {result.get('error')}")
          EOF
