          def normalize_case(text):
              if not text:
                  return text
              def title_chunk(word):
                  out, cap_next, chunk_len = [], True, 0
                  for c in word:
                      if c.isalpha():
                          out.append(c.upper() if cap_next else c.lower())
                          cap_next = False
                          chunk_len += 1
                      elif c == "'":
                          out.append(c)
                          cap_next = chunk_len <= 2
                          chunk_len = 0
                      elif c == "-":
                          out.append(c)
                          cap_next = True
                          chunk_len = 0
                      else:
                          out.append(c)
