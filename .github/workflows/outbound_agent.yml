          # ── Main loop ─────────────────────────────────────────────
          today_str = datetime.date.today().strftime("%A, %B %d, %Y")
          results   = {}
          for state_code in ["NY", "MA"]:
              state_name = "New York" if state_code == "NY" else "Massachusetts"
              added         = []
              skipped       = 0
              state_cap     = LEADS_PER_STATE[state_code]
              while len(added) < state_cap:
                  county = state[state_code]["county"]
                  if not county:
                      alert = f"⚠️ *{state_name}* has exhausted all available counties. Please add more counties to STATE_COUNTIES['{state_code}']."
                      requests.post("https://slack.com/api/chat.postMessage",
                          headers=SLACK_HEADERS, json={"channel": DAILY_OB_CHANNEL, "text": alert})
                      print(f"  ⚠️ {state_code} — all counties exhausted, alert sent")
                      break
                  print(f"\n{'='*50}")
                  is_big = is_big_county(state_code, county)
                  size_tag = "BIG" if is_big else "std"
                  print(f"🗽 {state_code} → 📍 {county} County [{size_tag}] ({len(added)}/{state_cap} leads so far)")
                  county_new      = 0
                  county_skipped  = 0
                  found_any_leads = False
                  # 2026-05-27: big counties (1M+ pop, deep LE org structures)
                  # need a much higher exhaustion ceiling. With a 25/day cap
                  # and 3 personas, a big county only really starts saturating
                  # after ~5-8 runs (~125-200 leads). Old defaults (4 batches,
                  # 2 empty passes) retired Nassau/Essex after ~25-40 leads.
                  MAX_BATCHES_PER_ORG  = 8 if is_big else 4
                  MAX_EMPTY_PASSES     = 6 if is_big else 2
                  ZERO_LEAD_MAX_RUNS   = 3 if is_big else 2
                  for org in ORG_TYPES:
                      if len(added) >= state_cap:
                          break
                      if not persona_allowed(state_code, county, org["type"]):
                          print(f"  ⏭️  Skipping {org['type']} in {county} (omitted — active sales cycle)")
                          continue
                      print(f"  Searching {org['type']}...")
                      org_found_names  = []
                      org_new_this_run = 0
                      for batch_num in range(1, MAX_BATCHES_PER_ORG + 1):
                          if len(added) >= state_cap:
                              break
                          # Defensive init so a raised claude() call doesn't leave
                          # `leads` / `batch_new` undefined when we check them below.
                          leads = []
                          batch_new = 0
                          try:
                              leads = find_leads(
                                  county, state_code, org["type"], org["titles"],
                                  exclude_names=org_found_names,
                                  batch=batch_num
                              )
                              if leads:
                                  found_any_leads = True
                              for lead in leads:
                                  if len(added) >= state_cap:
                                      break
                                  lead = normalize_lead(lead)
                                  fn = lead.get("first_name", "")
                                  ln = lead.get("last_name", "")
                                  if not fn or not ln:
                                      continue
                                  full_name = f"{fn} {ln}"
                                  org_found_names.append(full_name)
                                  if is_duplicate(lead.get("email", ""), fn, ln):
                                      county_skipped += 1
                                      skipped += 1
                                      print(f"    ↩ Duplicate: {full_name}")
                                      continue
                                  emails_body = gen_email_sequence(lead)
                                  subjects = {
                                      1: gen_subject(lead, 1),
                                      2: gen_subject(lead, 2),
                                      3: gen_subject(lead, 3),
                                      4: gen_subject(lead, 4),
                                  }
                                  result = create_contact(
                                      lead,
                                      email_body="",
                                      subject=subjects[1],
                                      emails=emails_body,
                                      subjects=subjects,
                                  )
                                  if result and result.get("id"):
                                      contact_id = result["id"]
                                      enrolled   = result.get("enrolled", False)
                                      added.append({
                                          "name":     full_name,
                                          "title":    lead.get("title", ""),
                                          "org":      lead.get("organization", ""),
                                          "id":       contact_id,
                                          "subject":  subjects[1],
                                          "enrolled": enrolled,
                                          "email":    lead.get("email", ""),
                                          "state":    state_code,
                                          "org_type": lead.get("org_type", org["type"]),
                                      })
                                      county_new       += 1
                                      org_new_this_run += 1
                                      batch_new        += 1
                                      state[state_code]["county_leads"][county] = state[state_code]["county_leads"].get(county, 0) + 1
                                      enroll_icon = "📧" if enrolled else "📭"
                                      print(f"    ✅ Added: {full_name} — {lead.get('title')} {enroll_icon}")
                                  time.sleep(1)
                          except Exception as e:
                              print(f"    Error: {e}")
                          if not leads or batch_new == 0:
                              print(f"    ℹ️ {org['type']} batch {batch_num} dry — moving to next org type")
                              break
                          print(f"    Batch {batch_num}: {batch_new} new. Looping for more...")
                          time.sleep(2)
                  print(f"  County pass: {county_new} new, {county_skipped} dupes, found_any={found_any_leads}")
                  # Reset the zero-lead counter as soon as we get a non-empty
                  # pass — only consecutive zero-lead runs should exhaust.
                  if found_any_leads:
                      zla = state[state_code].setdefault("zero_lead_attempts", {})
                      if county in zla:
                          print(f"  🔄 Resetting zero_lead_attempts[{county}] (was {zla[county]})")
                          zla.pop(county, None)
                  # Reset empty_passes when we actually added new contacts —
                  # only CONSECUTIVE all-dupe runs should count toward
                  # exhaustion, not interleaved-with-success runs.
                  if county_new > 0:
                      ep = state[state_code].setdefault("empty_passes", {})
                      if county in ep:
                          print(f"  🔄 Resetting empty_passes[{county}] (was {ep[county]})")
                          ep.pop(county, None)
                  if found_any_leads and county_new == 0 and county_skipped > 0:
                      state[state_code]["empty_passes"] = state[state_code].get("empty_passes", {})
                      state[state_code]["empty_passes"][county] = state[state_code]["empty_passes"].get(county, 0) + 1
                      empty_count = state[state_code]["empty_passes"][county]
                      print(f"  ⚠️ All-dupe pass #{empty_count} for {county}")
                      if empty_count >= MAX_EMPTY_PASSES:
                          print(f"  ⚠️ {county} fully exhausted after {empty_count} empty passes — moving to next county")
                          if county not in state[state_code]["exhausted"]:
                              state[state_code]["exhausted"].append(county)
                          next_c = next_county_for_state(state_code, state)
                          state[state_code]["county"] = next_c or None
                          if next_c:
                              print(f"  ➡️ Moving to: {next_c}")
                          else:
                              print(f"  ⚠️ No more counties for {state_code}")
                      continue
                  if not found_any_leads:
                      # No leads surfaced at all for this county across all org types.
                      # 2026-05-27: a single zero-lead run no longer exhausts
                      # the county — transient web_search rate limits (like
                      # the Mon 5/25 cascade) would otherwise wipe out big
                      # counties permanently. We now require ZERO_LEAD_MAX_RUNS
                      # consecutive zero-lead runs before exhausting.
                      state[state_code].setdefault("zero_lead_attempts", {})
                      zla = state[state_code]["zero_lead_attempts"]
                      zla[county] = zla.get(county, 0) + 1
                      zl_count = zla[county]
                      print(f"  ⚠️ No leads found in {county} (zero-lead run #{zl_count}/{ZERO_LEAD_MAX_RUNS})")
                      if zl_count >= ZERO_LEAD_MAX_RUNS:
                          print(f"  ⚠️ {county} marked exhausted after {zl_count} zero-lead runs")
                          if county not in state[state_code]["exhausted"]:
                              state[state_code]["exhausted"].append(county)
                          next_c = next_county_for_state(state_code, state)
                          state[state_code]["county"] = next_c or None
                          if next_c:
                              print(f"  ➡️ Moving to: {next_c}")
                              continue
                          else:
                              print(f"  ⚠️ No more counties for {state_code} — stopping at {len(added)}/{state_cap}")
                              break
                      else:
                          # Don't exhaust yet — advance to next county temporarily
                          # so today's daily cap still gets filled, but leave
                          # this county un-exhausted so it'll be retried.
                          # Pass `skip=county` so we actually move on instead
                          # of returning the same not-yet-exhausted county.
                          next_c = next_county_for_state(state_code, state, skip=county)
                          if next_c:
                              state[state_code]["county"] = next_c
                              print(f"  ➡️ Skipping (not exhausting) — moving to: {next_c}")
                              continue
                          else:
                              print(f"  ⚠️ No alternative county available — stopping at {len(added)}/{state_cap}")
                              break
                  if len(added) < state_cap:
                      print(f"  🔄 {county} still has leads — looping for more ({len(added)}/{state_cap})")
              results[state_code] = {
                  "county":  state[state_code]["county"] or county,
                  "added":   added,
                  "skipped": skipped,
              }
          # ── Save state & publish Gist ─────────────────────────────
          save_state(state)
          print(f"\nState saved: {json.dumps(state, indent=2)}")
          publish_gist(state)
          # ── Open DM channel ───────────────────────────────────────
          dm = requests.post("https://slack.com/api/conversations.open",
              headers=SLACK_HEADERS, json={"users": SLACK_USER})
          dm_ch = dm.json().get("channel", {}).get("id", "D08JJMN2L66")
          # ── Generate & upload chart ───────────────────────────────
          chart_path = generate_chart(state, results, today_str)
          upload_chart_to_slack(chart_path, DAILY_OB_CHANNEL, today_str)
          # ── Slack summary → #daily-ob ─────────────────────────────
          total_added    = sum(len(r["added"]) for r in results.values())
          total_skip     = sum(r["skipped"]    for r in results.values())
          total_enrolled = sum(1 for r in results.values() for c in r["added"] if c.get("enrolled"))
          msg  = f"<@{SLACK_USER}>\n"
          msg += f"*🎯 Daily Outbound Agent — {today_str}*\n"
          msg += f"*{total_added} new leads added | {total_skip} duplicates skipped*\n"
          msg += f"_Owner: {OWNER_NAME} · Personas: {', '.join(ACTIVE_PERSONAS)}_\n"
          msg += f"_<{CONSOLIDATED_LIST_URL}|View consolidated list in HubSpot>_\n\n"
          for state_code in ["NY", "MA"]:
              data = results[state_code]
              state_name = "New York" if state_code == "NY" else "Massachusetts"
              county       = data["county"]
              added_st     = data["added"]
              skipped_st   = data["skipped"]
              county_leads = state[state_code].get("county_leads", {})
              exhausted    = state[state_code].get("exhausted", [])
              def sig_icons(cs):
                  icons = ""
                  if cs.get("tier3_body_cam"):           icons += "📷"
                  if cs.get("tier3_transcription_line"): icons += "📝"
                  if cs.get("tier4_arpa"):               icons += "💰"
                  return icons
              cs_curr    = county_scores.get(county_key(state_code, county), {})
              curr_score = cs_curr.get("score", "?")
              curr_icons = sig_icons(cs_curr)
              curr_badge = f"{' ' + curr_icons if curr_icons else ''} _{curr_score}/100_" if curr_score != "?" else ""
              upcoming = get_upcoming_counties(state_code, state, n=2)
              if upcoming:
                  up_parts = []
                  for c in upcoming:
                      cs = county_scores.get(county_key(state_code, c), {})
                      sc = cs.get("score", "?")
                      ic = sig_icons(cs)
                      up_parts.append(f"*{c}*{' ' + ic if ic else ''} _{sc}/100_")
                  next_line = f"  ⏭ *Next:* {'  ·  '.join(up_parts)}"
              else:
                  next_line = f"  ⚠️ All {state_code} counties exhausted — add more to STATE_COUNTIES"
              exhausted_parts = [f"{c} ({county_leads.get(c, 0)})" for c in exhausted if c in county_leads]
              exhausted_line  = f"  ✅ *Done:* {'  ·  '.join(exhausted_parts)}" if exhausted_parts else ""
              active_count = county_leads.get(county, 0)
              # Per-persona tally for this state
              persona_emojis = {
                  "Public Defender":              "⚖️",
                  "District Attorney":            "🧑‍⚖️",
                  "Police/Sheriff Investigators": "🚓",
              }
              persona_counts = {}
              for c in added_st:
                  pt = c.get("org_type", "")
                  if pt:
                      persona_counts[pt] = persona_counts.get(pt, 0) + 1
              persona_parts = []
              for p in ACTIVE_PERSONAS:
                  emoji = persona_emojis.get(p, "·")
                  persona_parts.append(f"{emoji} {p}: {persona_counts.get(p, 0)}")
              persona_line = "  " + "  ·  ".join(persona_parts)
              msg += f"*🗽 {state_name}* — {len(added_st)} leads added\n"
              msg += f"{persona_line}\n"
              msg += f"  📍 *Now:* {county}{curr_badge} — {active_count} leads assigned\n"
              msg += f"{next_line}\n"
              if exhausted_line:
                  msg += f"{exhausted_line}\n"
              msg += "\n"
          msg += f"_Powered by Claude · NY+MA Law Enforcement Outbound Agent v1 · {len(ACTIVE_PERSONAS)}-persona mode_"
          requests.post("https://slack.com/api/chat.postMessage",
              headers=SLACK_HEADERS, json={"channel": DAILY_OB_CHANNEL, "text": msg})
          print(f"\n✅ Done! {total_added} leads added, {total_enrolled} enrolled in sequence.")
          EOF
