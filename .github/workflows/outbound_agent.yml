          def gen_subject(contact, email_num=1):
              if email_num in (2, 4):
                  return ""
              org_type = contact.get("org_type", "Public Defender")
              angles   = PERSONA_ANGLES.get(org_type) or next(iter(PERSONA_ANGLES.values()))
              # 2026-07-14 (JL): ported the Core agent's subject de-markdown —
              # Haiku wraps subjects in **bold** that renders literally in HubSpot.
              NO_FMT = " Return ONLY the plain-text subject line: no markdown, no asterisks, no bold, no quotes, no emoji, no em dashes."
              prompts  = {
                  1: f"Cold email subject for {contact['title']} at {contact['organization']} about Rev {angles['use_case']}. Under 10 words. Professional, curiosity-driving.{NO_FMT}",
                  3: f"Value-add subject for {contact['title']} — 3rd email about {angles['use_case']}. Under 8 words. Insight-driven.{NO_FMT}",
              }
              raw = claude_copy(prompts[email_num], max_tokens=50)
              raw = re.sub(r'```[a-zA-Z]*', '', raw).replace('```', '')
              raw = raw.replace('*', '').replace('`', '').replace('_', '')
              raw = re.sub(r'^\s*#+\s*', '', raw)
              raw = raw.strip().strip('"').strip("'").strip()
              return raw[:80]
          # ── Buying role ───────────────────────────────────────────
          def get_buying_role(title):
              t = title.lower()
              if any(x in t for x in [
                  "sheriff", "district attorney", "chief of police", "public defender", "chief deputy",
                  "first assistant", "chief assistant", "chief investigator", "chief of investigations"
              ]):
                  return "DECISION_MAKER"
              if any(x in t for x in ["commander", "captain", "lieutenant", "supervising"]):
                  return "INFLUENCER"
              if any(x in t for x in ["investigator", "detective", "analyst", "trial attorney", "staff attorney"]):
                  return "END_USER"
              if any(x in t for x in ["legal", "compliance"]):
                  return "LEGAL_AND_COMPLIANCE"
              return "BUDGET_HOLDER"
          # ── Enroll contact in HubSpot Sequence ───────────────────
          def enroll_in_sequence(contact_id, contact_email):
              if not contact_email:
                  print(f"    ⚠️ No email — skipping sequence enrollment for contact {contact_id}")
                  return False
              payload = {
                  "sequenceId":       SEQUENCE_ID,
                  "contactId":        contact_id,
                  "enrolledByUserId": owner_id,
              }
              resp = requests.post(
                  "https://api.hubapi.com/automation/v4/sequences/enrollments",
                  headers=HS_HEADERS,
                  json=payload
              )
              if resp.status_code in (200, 201, 204):
                  print(f"    ✅ Enrolled in sequence: contact {contact_id}")
                  return True
              else:
                  print(f"    ⚠️ Sequence enrollment failed ({resp.status_code}): {resp.text[:300]}")
                  return False
