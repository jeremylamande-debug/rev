name: Daily Outbound Agent — NY & MA Law Enforcement
on:
  schedule:
    - cron: '0 6 * * 1-5'  # 2:00 AM ET (UTC-4 EDT), Mon–Fri
  workflow_dispatch:
jobs:
  run-outbound-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Run Outbound Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY:   ${{ secrets.HUBSPOT_API_KEY }}
          SLACK_BOT_TOKEN:   ${{ secrets.SLACK_BOT_TOKEN }}
          GIST_TOKEN:        ${{ secrets.GIST_TOKEN }}
        run: |
          pip install requests pytz matplotlib --quiet
          python3 - <<'EOF'
          import requests, json, os, time, datetime, re, matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.patches as mpatches
          import numpy as np
          ANTHROPIC_KEY = os.environ["ANTHROPIC_API_KEY"]
          HUBSPOT_KEY   = os.environ["HUBSPOT_API_KEY"]
          SLACK_TOKEN   = os.environ["SLACK_BOT_TOKEN"]
          GIST_TOKEN    = os.environ.get("GIST_TOKEN", "")
          GIST_ID       = os.environ.get("GIST_ID", "")
          PORTAL_ID     = "21451281"
          # ════════════════════════════════════════════════════════════
          # ACTIVE CONFIG — NY & MA Law Enforcement (Mike Merritts only)
          # Pivoted from CA on 2026-05-20. Full CA block preserved
          # commented-out below for instant revival when you ask.
          # ════════════════════════════════════════════════════════════
          # ── Daily lead cap ─────────────────────────────────────────
          # 50 leads/day total, split 25 NY / 25 MA.
          LEADS_PER_STATE = {
              "NY": 25,
              "MA": 25,
          }
          TOTAL_DAILY_CAP = sum(LEADS_PER_STATE.values())
          # ── Single owner: Mike Merritts ────────────────────────────
          OWNER_NAME  = "Mike Merritts"
          OWNER_EMAIL = "mike.merritts@rev.com"
          MEETING_LINK = "https://meetings.hubspot.com/mike-merritts"
          CONSOLIDATED_LIST_URL = f"https://app.hubspot.com/contacts/{PORTAL_ID}/objects/0-1/views/65837308/list"
          SLACK_USER       = "U08JJMM2QSW"
          DAILY_OB_CHANNEL = "C0AQFHD6Q4F"  # #daily-ob
          SEQUENCE_ID      = "304238924"
          HS_HEADERS    = {"Authorization": f"Bearer {HUBSPOT_KEY}", "Content-Type": "application/json"}
          SLACK_HEADERS = {"Authorization": f"Bearer {SLACK_TOKEN}", "Content-Type": "application/json"}
          ANTH_HEADERS  = {
              "Content-Type": "application/json",
              "x-api-key": ANTHROPIC_KEY,
              "anthropic-version": "2023-06-01"
          }
          # ── NY + MA counties (all enabled, large-first) ────────────
          # 2026-05-25: Per JL, the ≤500K population cap restriction has
          # been removed for both states. Trigger was the Bronx Public
          # Defender inbound that converted well — large urban counties
          # are now in scope for Mike to prospect into.
          #
          # NY now includes the 5 NYC boroughs (New York/Manhattan,
          # Kings/Brooklyn, Queens, Bronx, Richmond/Staten Island) plus
          # Nassau, Suffolk, Westchester, Erie (Buffalo), and Monroe
          # (Rochester). MA now includes Middlesex, Worcester, Essex,
          # Suffolk (Boston), and Norfolk.
          #
          # Counties are listed large-first because Claude API county
          # scoring re-sorts by signal score on first run; on cold-start
          # days (no cached scores) the large counties get worked first
          # by virtue of their list position, which matches the new
          # prioritization intent.
          STATE_COUNTIES = {
              "NY": [
                  # Large counties (re-enabled 2026-05-25)
                  "New York",     # ~1.6M, Manhattan
                  "Kings",        # ~2.6M, Brooklyn
                  "Queens",       # ~2.3M, Queens
                  "Bronx",        # ~1.4M, Bronx — recent Bronx PD inbound win
                  "Richmond",     # ~495K, Staten Island
                  "Nassau",       # ~1.4M, Long Island
                  "Suffolk",      # ~1.5M, Long Island
                  "Westchester",  # ~1.0M, NYC suburbs
                  "Erie",         # ~950K, Buffalo
                  "Monroe",       # ~750K, Rochester
                  # Mid-size counties
                  "Onondaga",     # ~470K, Syracuse
                  "Orange",       # ~400K, lower Hudson Valley
                  "Rockland",     # ~340K, NYC suburbs
                  "Albany",       # ~315K, state capital region
                  "Dutchess",     # ~295K, Poughkeepsie
                  "Saratoga",     # ~235K, Saratoga Springs
                  "Oneida",       # ~230K, Utica
                  "Niagara",      # ~210K, Niagara Falls
                  "Broome",       # ~200K, Binghamton
                  "Ulster",       # ~180K, Kingston
                  "Rensselaer",   # ~160K, Troy
                  "Schenectady",  # ~160K
                  "Chautauqua",   # ~125K
                  "Jefferson",    # ~115K, Watertown
                  "Ontario",      # ~115K, Canandaigua
                  "St. Lawrence", # ~108K
                  "Tompkins",     # ~105K, Ithaca
                  "Putnam",       # ~98K
                  "Sullivan",     # ~80K
                  "Cattaraugus",  # ~77K
              ],
              # ── MA: orgs structured by DA District, county Sheriff (jails),
              # CPCS regions (Public Defender), and municipal PDs. We map
              # work to counties for territory/reporting but the agent's
              # search prompts adjust per-org-type below.
              "MA": [
                  # Large counties (re-enabled 2026-05-25)
                  "Middlesex",    # ~1.6M, Cambridge/Lowell
                  "Worcester",    # ~860K, Worcester
                  "Essex",        # ~810K, Salem/Lawrence
                  "Suffolk",      # ~800K, Boston
                  "Norfolk",      # ~725K, Quincy/Dedham
                  # Mid-size + smaller counties
                  "Bristol",      # ~580K, Fall River/New Bedford
                  "Plymouth",     # ~530K, Plymouth/Brockton
                  "Hampden",      # ~465K, Springfield
                  "Barnstable",   # ~230K, Cape Cod
                  "Hampshire",    # ~163K, Northampton
                  "Berkshire",    # ~120K, Pittsfield
                  "Franklin",     # ~70K, Greenfield
                  "Dukes",        # ~20K, Martha's Vineyard
                  "Nantucket",    # ~14K
              ],
          }
          # ── Big-county tier (2026-05-27 fix) ───────────────────────
          # Counties with deep LE org structures (NYPD borough commands,
          # county-wide PDs, DA bureaus). Saturating these takes far more
          # than the default MAX_EMPTY_PASSES=2 / MAX_BATCHES_PER_ORG=4
          # would allow — a 1.4M-pop county like Nassau realistically has
          # hundreds of DAs/PDs/detectives across precincts, defender
          # offices, and the Sheriff's Office. Without this tier the
          # 25-lead daily cap collides with the dupe-based exhaustion
          # logic and retires these counties after ~25-40 leads total.
          BIG_COUNTIES = {
              "NY": {
                  "New York", "Kings", "Queens", "Bronx", "Richmond",
                  "Nassau", "Suffolk", "Westchester", "Erie", "Monroe",
              },
              "MA": {
                  "Middlesex", "Worcester", "Essex", "Suffolk", "Norfolk",
              },
          }
          def is_big_county(state_code, county):
              return county in BIG_COUNTIES.get(state_code, set())
          # ── Active personas (locked to the 3 we established) ───────
          ACTIVE_PERSONAS = [
              "Public Defender",
              "District Attorney",
              "Police/Sheriff Investigators",
          ]
          # ── Per-county persona omits ───────────────────────────────
          # Used to skip prospecting a specific persona in a specific
          # county when the org is already engaged in a sales cycle and
          # we don't want to cold-outreach into them.
          #
          # Format: {(state_code, county): {persona, ...}}
          # 2026-05-27 — Bronx Defenders engaged via recent inbound win
          # (per the STATE_COUNTIES NY note at line 80). Public Defender
          # in Bronx is now off-limits while the cycle is active. DA and
          # Police/Sheriff in Bronx remain in scope.
          PERSONA_OMIT = {
              ("NY", "Bronx"): {"Public Defender"},
          }
          def persona_allowed(state_code, county, persona):
              return persona not in PERSONA_OMIT.get((state_code, county), set())
          # ── Org types & titles (state-aware search guidance) ───────
          # Search prompts per state adjust org structure (MA DAs are
          # district-based; MA Public Defender = CPCS regional).
          ORG_TYPES = [
              {"type": "District Attorney", "titles": ["District Attorney", "First Assistant DA", "Chief Assistant DA", "Assistant District Attorney", "Deputy District Attorney", "Chief Investigator", "Senior Investigator", "Investigator"]},
              {"type": "Public Defender",   "titles": ["Public Defender", "Chief Public Defender", "Chief Deputy Public Defender", "Assistant Public Defender", "Deputy Public Defender", "Staff Attorney", "Trial Attorney", "Supervising Attorney"]},
              {"type": "Police/Sheriff Investigators",
               "titles": [
                   # Command
                   "Sheriff", "Undersheriff", "Chief Deputy Sheriff",
                   "Chief of Police", "Deputy Chief", "Assistant Chief",
                   "Commander", "Captain", "Lieutenant",
                   # Investigators
                   "Chief Investigator", "Senior Investigator",
                   "Criminal Investigator", "Detective Investigator",
                   "Special Investigator", "Detective",
                   "Sergeant Investigations", "Investigations Sergeant",
               ]},
          ]
          # ── Persona angles (3 active personas) ─────────────────────
          PERSONA_ANGLES = {
              "District Attorney": {
                  "pain":     "preparing court proceedings and managing evidence documentation",
                  "use_case": "court proceeding transcription and evidence documentation",
                  "proof":    "DA offices using Rev reduce case prep time significantly"
              },
              "Public Defender": {
                  "pain":     "transcribing client interviews and case preparation recordings",
                  "use_case": "client interview transcription and case prep documentation",
                  "proof":    "public defender offices using Rev improve case turnaround"
              },
              "Police/Sheriff Investigators": {
                  "pain":     "investigators and command staff drowning in body cam, interview, and interrogation footage that has to be reviewed and documented manually",
                  "use_case": "interview/interrogation transcription, body cam documentation, and case-file evidence prep",
                  "proof":    "investigations units using Rev cut review and documentation time by 60%, freeing detectives to close more cases"
              },
          }
          DEPT_MAP = {
              "District Attorney":             "DA Office",
              "Public Defender":               "Public Defender",
              "Police/Sheriff Investigators":  "Police/Sheriff Investigators",
          }
          # ── Procurement notes per state ────────────────────────────
          STATE_PROCUREMENT = {
              "NY": "NY OGS Centralized Contract available — NYS Contract PT (Manageable Print Services / SaaS) and OGS IT Umbrella Contracts allow direct purchase without separate RFP. County agencies can piggyback on state contracts.",
              "MA": "MA Statewide Contract via COMMBUYS — ITS78 (Software & Services) and ITC73 (IT Project Services) vehicles allow county/municipal LE agencies to purchase directly without standalone procurement.",
          }
          # ── Persona angles & DEPT_MAP filtered to ACTIVE_PERSONAS ──
          ORG_TYPES = [o for o in ORG_TYPES if o["type"] in ACTIVE_PERSONAS]
          print(f"🎯 Active personas ({len(ORG_TYPES)}): {[o['type'] for o in ORG_TYPES]}")
          print(f"📍 States: NY ({len(STATE_COUNTIES['NY'])} counties) + MA ({len(STATE_COUNTIES['MA'])} counties)")
          print(f"👤 Single owner: {OWNER_NAME} ({OWNER_EMAIL})")
          print(f"📊 Daily cap: {TOTAL_DAILY_CAP} ({LEADS_PER_STATE['NY']} NY / {LEADS_PER_STATE['MA']} MA)")
          # ── HubSpot helpers ───────────────────────────────────────
          def hs_get(path):
              r = requests.get(f"https://api.hubapi.com{path}", headers=HS_HEADERS)
              return r.json()
          def hs_post(path, payload):
              r = requests.post(f"https://api.hubapi.com{path}", headers=HS_HEADERS, json=payload)
              return r.json()
          # ── Resolve Mike Merritts' HubSpot owner ID at runtime ────
          owners = hs_get("/crm/v3/owners").get("results", [])
          owner_id = None
          for o in owners:
              if o.get("email", "").lower() == OWNER_EMAIL.lower():
                  owner_id = o["id"]
                  break
          if not owner_id:
              for o in owners:
                  full = f"{o.get('firstName','')} {o.get('lastName','')}".strip()
                  if full.lower() == OWNER_NAME.lower():
                      owner_id = o["id"]
                      break
          if not owner_id:
              raise RuntimeError(f"❌ Could not find HubSpot owner for {OWNER_NAME} ({OWNER_EMAIL}). Verify owner exists.")
          print(f"✅ Resolved owner: {OWNER_NAME} → ID {owner_id}")
          LEADSOURCE_VALUE = "Claude"
          # ── State → county lookup (for ownership audit) ───────────
          ALL_COUNTIES = {}
          for state_code, counties in STATE_COUNTIES.items():
              for c in counties:
                  ALL_COUNTIES[(state_code, c)] = OWNER_NAME  # all → Mike
          # ── Ownership audit (every OB contact → Mike) ─────────────
          def audit_ownership():
              """Find & fix any OB contacts whose owner isn't Mike."""
              print("🔍 Auditing contact ownership (all OB → Mike)...")
              fixes = []
              offset = 0
              while True:
                  resp = hs_post("/crm/v3/objects/contacts/search", {
                      "filterGroups": [{"filters": [
                          {"propertyName": "lead_source_details", "operator": "EQ", "value": "JL OB"},
                          {"propertyName": "state", "operator": "IN", "values": ["New York", "Massachusetts"]}
                      ]}],
                      "properties": ["county", "state", "hubspot_owner_id"],
                      "limit": 200,
                      "after": offset if offset else None
                  })
                  results = resp.get("results", [])
                  for c in results:
                      actual_id = str(c["properties"].get("hubspot_owner_id") or "")
                      if actual_id != str(owner_id):
                          fixes.append({"id": c["id"],
                                        "county": c["properties"].get("county", ""),
                                        "state":  c["properties"].get("state",  "")})
                  paging = resp.get("paging", {})
                  next_after = paging.get("next", {}).get("after")
                  if not next_after:
                      break
                  offset = next_after
              if not fixes:
                  print(f"  ✅ All NY/MA OB contacts already owned by Mike")
                  return
              print(f"  ⚠️ Found {len(fixes)} ownership mismatches — reassigning to Mike...")
              for i in range(0, len(fixes), 10):
                  batch = fixes[i:i+10]
                  inputs = [{"id": f["id"], "properties": {"hubspot_owner_id": str(owner_id)}} for f in batch]
                  requests.patch("https://api.hubapi.com/crm/v3/objects/contacts/batch/update",
                      headers=HS_HEADERS, json={"inputs": inputs})
                  for f in batch:
                      print(f"    ✅ Reassigned {f['state']}/{f['county']} contact {f['id']} → Mike")
              print(f"  ✅ Ownership audit complete — {len(fixes)} contacts corrected")
          audit_ownership()
          # ── Ensure county signal properties exist in HubSpot ──────
          COUNTY_PROPS = [
              {
                  "name":        "county_signal_score",
                  "label":       "County Signal Score",
                  "description": "0-100 composite score based on Rev outbound signal tiers (size, tech readiness, direct pain, buying momentum).",
                  "type":        "number",
                  "fieldType":   "number",
              },
              {
                  "name":        "county_carahsoft__naspo",
                  "label":       "Procurement Context",
                  "description": "Purchasing contract vehicle reps can reference to bypass RFP. NY = OGS contracts; MA = COMMBUYS statewide.",
                  "type":        "string",
                  "fieldType":   "text",
              },
              {
                  "name":        "county_transcription_budget_k",
                  "label":       "Transcription Budget ($K)",
                  "description": "Dollar amount (in thousands) budgeted for transcription services in the county's law enforcement departments. 0 = no line item found.",
                  "type":        "number",
                  "fieldType":   "number",
              },
              {
                  "name":        "county_body_cam_program",
                  "label":       "County Body Cam Program",
                  "description": "True if the county Sheriff or Police department has an active body-worn camera (BWC) program.",
                  "type":        "bool",
                  "fieldType":   "booleancheckbox",
              },
              {
                  "name":        "county_signal_snippet",
                  "label":       "County Signal Snippet",
                  "description": "2-line rep-facing context pulled from county budget signals. Use to personalize cold outreach.",
                  "type":        "string",
                  "fieldType":   "textarea",
              },
              {
                  # 2026-05-27 — rep-facing label so it's easy to see at a
                  # glance which exact office / org an OB contact belongs
                  # to (Bronx DA vs Legal Aid NYC vs NYPD Manhattan South
                  # Detective Bureau etc). Mirrors the `organization`
                  # string Claude returns in find_leads.
                  "name":        "office",
                  "label":       "Office",
                  "description": "Specific office / organization the contact belongs to (e.g. 'Bronx County District Attorney's Office', 'Legal Aid Society NYC', 'NYPD Manhattan South Detective Bureau'). Populated automatically by the OB agent.",
                  "type":        "string",
                  "fieldType":   "text",
              },
              {
                  # 2026-05-27 — which of the ACTIVE_PERSONAS this contact
                  # represents. Mirrors `org_type` from find_leads so it can
                  # be filtered/segmented in HubSpot views without
                  # string-matching the company name.
                  #
                  # 2026-05-29: renamed from `persona`/`Persona` to
                  # `ob_persona`/`OB Persona` to dodge a HubSpot label
                  # collision — another property in this portal already
                  # owns the label "Persona", which made every contact
                  # create fail with PROPERTY_DOESNT_EXIST. Distinct name
                  # + distinct label sidesteps both the 409-on-name and
                  # 400-on-label-uniqueness paths.
                  "name":        "ob_persona",
                  "label":       "OB Persona",
                  "description": "Which OB-agent persona this contact belongs to: Public Defender, District Attorney, or Police/Sheriff Investigators (Legal) — or HR/ER Leader, Workplace Investigator, Compliance/Ethics (Core). Set automatically at create time from the agent's org_type.",
                  "type":        "enumeration",
                  "fieldType":   "select",
                  "options": [
                      {"label": "Public Defender",              "value": "Public Defender",              "displayOrder": 0},
                      {"label": "District Attorney",            "value": "District Attorney",            "displayOrder": 1},
                      {"label": "Police/Sheriff Investigators", "value": "Police/Sheriff Investigators", "displayOrder": 2},
                  ],
              },
          ]
          for prop in COUNTY_PROPS:
              try:
                  body = {
                      "name":        prop["name"],
                      "label":       prop["label"],
                      "description": prop["description"],
                      "type":        prop["type"],
                      "fieldType":   prop["fieldType"],
                      "groupName":   "contactinformation",
                  }
                  # Enumeration properties (e.g. `persona`) need their
                  # dropdown values passed at creation time.
                  if "options" in prop:
                      body["options"] = prop["options"]
                  r = requests.post(
                      "https://api.hubapi.com/crm/v3/properties/contacts",
                      headers=HS_HEADERS,
                      json=body
                  )
                  status = r.status_code
                  if status not in (200, 201, 409):
                      print(f"  ⚠️ Property create issue ({prop['name']}): {status} {r.text[:120]}")
                  else:
                      print(f"  ✅ Property ready: {prop['name']} ({status})")
              except Exception as e:
                  print(f"  ⚠️ Property setup error ({prop['name']}): {e}")
          # ── State management ──────────────────────────────────────
          STATE_MARKER = "OUTBOUND_AGENT_STATE_V5_NYMA"  # bumped from V4 — large-counties expansion 2026-05-25 (fresh start so NY begins at New York/Manhattan, not the old next-county pointer)
          def load_state():
              try:
                  resp = hs_post("/crm/v3/objects/notes/search", {
                      "filterGroups": [{"filters": [
                          {"propertyName": "hs_note_body", "operator": "CONTAINS_TOKEN", "value": STATE_MARKER}
                      ]}],
                      "properties": ["hs_note_body", "hs_timestamp"],
                      "sorts": [{"propertyName": "hs_timestamp", "direction": "DESCENDING"}],
                      "limit": 1
                  })
                  results = resp.get("results", [])
                  if results:
                      body = results[0]["properties"]["hs_note_body"]
                      json_str = body.split(STATE_MARKER)[1].strip()
                      return json.loads(json_str)
              except Exception as e:
                  print(f"State load error: {e}")
              return None
          def save_state(state):
              try:
                  hs_post("/crm/v3/objects/notes", {
                      "properties": {
                          "hs_note_body": f"{STATE_MARKER}\n{json.dumps(state)}",
                          "hs_timestamp": str(int(datetime.datetime.now().timestamp() * 1000))
                      }
                  })
              except Exception as e:
                  print(f"State save error: {e}")
          def init_state():
              return {
                  "NY": {"county": STATE_COUNTIES["NY"][0], "exhausted": [], "county_leads": {}},
                  "MA": {"county": STATE_COUNTIES["MA"][0], "exhausted": [], "county_leads": {}},
              }
          def next_county_for_state(state_code, state, skip=None):
              """Return the first non-exhausted county, optionally skipping a given county."""
              exhausted_self = set(state[state_code].get("exhausted", []))
              skip_set = {skip} if skip else set()
              for county in STATE_COUNTIES[state_code]:
                  if county not in exhausted_self and county not in skip_set:
                      return county
              return None
          def get_upcoming_counties(state_code, state, n=2):
              """Return the next N counties after the current active one (excluding exhausted)."""
              exhausted_self = set(state[state_code].get("exhausted", []))
              current        = state[state_code].get("county")
              full_list      = STATE_COUNTIES[state_code]
              upcoming       = [c for c in full_list if c not in exhausted_self and c != current]
              return upcoming[:n]
          # ── County scoring (will populate via Claude API on first run) ──
          SCORE_MARKER   = "COUNTY_SCORE_STATE_V4_NYMA"  # bumped from V3 on 2026-05-26 — invalidates the cache that came back 43/44 zeros on the Monday 5/25 run (web-search rate-limit cascade after Ontario succeeded); paired with the resilience fixes below this is a one-shot reset.
          SCORE_MAX_DAYS = 7
          # No seed scores for NY/MA — Claude API will score on first run and cache.
          # CA seed scores preserved in dormant block below.
          def load_county_scores():
              try:
                  resp = hs_post("/crm/v3/objects/notes/search", {
                      "filterGroups": [{"filters": [
                          {"propertyName": "hs_note_body", "operator": "CONTAINS_TOKEN", "value": SCORE_MARKER}
                      ]}],
                      "properties": ["hs_note_body", "hs_timestamp"],
                      "sorts": [{"propertyName": "hs_timestamp", "direction": "DESCENDING"}],
                      "limit": 1
                  })
                  results = resp.get("results", [])
                  if results:
                      body      = results[0]["properties"]["hs_note_body"]
                      ts        = int(results[0]["properties"]["hs_timestamp"]) / 1000
                      age_days  = (datetime.datetime.now().timestamp() - ts) / 86400
                      if age_days <= SCORE_MAX_DAYS:
                          json_str = body.split(SCORE_MARKER)[1].strip()
                          scores   = json.loads(json_str)
                          print(f"✅ Loaded county scores ({age_days:.1f}d old): {list(scores.keys())}")
                          return scores
                      else:
                          print(f"⚠️ County scores stale ({age_days:.1f}d) — will refresh via Claude API")
              except Exception as e:
                  print(f"Score load error: {e}")
              print("🌱 No cached scores — will score all NY/MA counties via Claude API")
              return None
          def save_county_scores(scores):
              try:
                  hs_post("/crm/v3/objects/notes", {
                      "properties": {
                          "hs_note_body": f"{SCORE_MARKER}\n{json.dumps(scores)}",
                          "hs_timestamp": str(int(datetime.datetime.now().timestamp() * 1000))
                      }
                  })
                  print(f"✅ County scores saved ({len(scores)} counties)")
              except Exception as e:
                  print(f"Score save error: {e}")
          def score_county(county, state_code):
              state_name = "New York" if state_code == "NY" else "Massachusetts"
              procurement_hint = STATE_PROCUREMENT[state_code]
              prompt = f"""You are a B2B sales intelligence analyst. Research {county} County, {state_name}
          for signals relevant to selling Rev's legal transcription software (~$15k/yr) to law enforcement.
          Procurement context for this state: {procurement_hint}
          Search for and answer each question below with a number/boolean and 1-line evidence:
          TIER 0 — Procurement vehicle (most important)
          T0a. Does {county} County purchase software via {state_code} statewide cooperative contracts (OGS for NY, COMMBUYS for MA), Sourcewell, OMNIA Partners, or any other cooperative purchasing contract? (yes=25pts / no=0)
          TIER 1 — Size
          T1a. What is the {county} County Sheriff's Office annual budget? (>$40M=10, $10-40M=7, $5-10M=4, <$5M=1)
          T1b. What is the {county} County District Attorney annual budget? (>$15M=10pts in context, note for reference)
          TIER 2 — Tech readiness
          T2a. What % of {county} County's total budget goes to IT/technology? (>3%=8, 2-3%=5, <2%=2)
          T2b. Is {county} County IT budget growing YoY? (yes=5, flat/declining=0)
          T2c. Does {county} County have active SaaS or software subscription purchases across departments? (yes=5, no=0)
