          # ── Email sequence ────────────────────────────────────────
          def clean_email_body(text, first_name=None):
              if not text:
                  return text
              # 2026-07-14 (JL): ported the Core agent's robustness pass. Haiku
              # intermittently (a) wraps the whole body in a ```html ... ```
              # markdown code fence, (b) emits markdown links [text](url),
              # (c) bolds with **...**, (d) separates paragraphs with \n\n,
              # and (e) emits the greeting TWICE (plain + again inside the
              # fence). The old cleaner ran .replace("\n","") BEFORE stripping
              # fences, producing the "```htmlHi Name," artifact + duplicated
              # greeting + wall-of-text. Order matters: strip fences and
              # convert markdown FIRST, turn paragraph breaks into <br><br>,
              # THEN drop stray newlines, THEN collapse duplicate greetings.
              # 0) Strip markdown code fences (```html, ```python, bare ```)
              text = re.sub(r'```[a-zA-Z]*', '', text)
              text = text.replace('```', '')
              lines = [l for l in text.splitlines() if not l.strip().lower().startswith("subject:")]
              cleaned = "\n".join(lines).strip()
              # 1) Markdown link  [text](url) -> <a href="url">text</a>
              cleaned = re.sub(r'\[([^\]]+)\]\((https?://[^)\s]+)\)', r'<a href="\2">\1</a>', cleaned)
              # 2) Strip markdown emphasis (**bold**, __bold__, *italic*)
              cleaned = re.sub(r'\*\*([^*]+)\*\*', r'\1', cleaned)
              cleaned = re.sub(r'__([^_]+)__', r'\1', cleaned)
              cleaned = re.sub(r'(?<!\*)\*(?!\*)([^*\n]+?)\*(?!\*)', r'\1', cleaned)
              # 3) Preserve paragraph breaks: blank line -> <br><br>; a lone
              #    newline -> single space so wrapped lines re-flow cleanly.
              cleaned = re.sub(r'\n[ \t]*\n+', '<br><br>', cleaned)
              cleaned = re.sub(r'\n', ' ', cleaned)
              cleaned = re.sub(r'  +', ' ', cleaned)
              cleaned = re.sub(r'(<br\s*/?>)+', '<br><br>', cleaned, flags=re.IGNORECASE)
              cleaned = re.sub(r'^(Hi\s+[^,<]{1,40},)(?!\s*<br)\s*', r'\1<br><br>', cleaned, flags=re.IGNORECASE)
              if first_name:
                  cleaned = re.sub(
                      r'^\s*(?:Hello|Hi|Dear|Greetings|Good\s+(?:morning|afternoon|evening))\b[^,<]{0,60}\s*,\s*(?:<br\s*/?>\s*)*',
                      f"Hi {first_name},<br><br>",
                      cleaned, count=1, flags=re.IGNORECASE
                  )
                  if not re.match(r'^\s*Hi\s+' + re.escape(first_name) + r'\s*,', cleaned, flags=re.IGNORECASE):
                      cleaned = re.sub(r'^(?:\s|<br\s*/?>)+', '', cleaned, flags=re.IGNORECASE)
                      cleaned = f"Hi {first_name},<br><br>" + cleaned
                  cleaned = re.sub(
                      r'^Hi\s+' + re.escape(first_name) + r'\s*,\s*(?:<br\s*/?>\s*)+',
                      f"Hi {first_name},<br><br>",
                      cleaned, count=1, flags=re.IGNORECASE
                  )
                  # 2026-07-14 (JL): collapse a DUPLICATED greeting (greeting
                  # emitted plain AND again inside the stripped fence). Strip
                  # every repeated greeting immediately after the canonical one.
                  cleaned = re.sub(
                      r'^(Hi\s+' + re.escape(first_name) + r'\s*,\s*(?:<br\s*/?>\s*)*)'
                      r'(?:(?:Hello|Hi|Dear|Greetings)\s+' + re.escape(first_name) + r'\s*,?\s*(?:<br\s*/?>\s*)*)+',
                      r'\1',
                      cleaned, flags=re.IGNORECASE,
                  )
              # ── Hard strip em/en dashes (model leaks these despite prompt rules) ──
              # Em dash (—, U+2014) and en dash (–, U+2013).
              # Strategy: " — " or " – " (spaced) → ". " (sentence break).
              #           "word—word" or "word–word" (unspaced) → ", " (clause join).
              cleaned = re.sub(r'\s+[—–]\s+', '. ', cleaned)
              cleaned = re.sub(r'[—–]', ', ', cleaned)
              # Collapse any ". ." or ", ," artifacts from the swap
              cleaned = re.sub(r'\.\s*\.', '.', cleaned)
              cleaned = re.sub(r',\s*,', ',', cleaned)
              cleaned = re.sub(r'\s+([.,])', r'\1', cleaned)
              meet_url = r'https?://meetings\.hubspot\.com/[A-Za-z0-9_\-]+'
              cleaned = re.sub(
                  r'\b(?:here(?:\'s)?|at)\s*:?\s+(' + meet_url + r')',
                  r'on <a href="\1">my calendar</a>',
