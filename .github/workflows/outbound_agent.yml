                  cleaned = body
              cleaned = re.sub(r'(<br\s*/?>)+$', '', cleaned.rstrip(), flags=re.IGNORECASE)
              # 2026-07-14 (JL): end with <br><br> (was single <br>) so all
              # emails get consistent breathing room above the signature —
