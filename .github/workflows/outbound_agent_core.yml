          def get_buying_role(title):
              t = (title or "").lower()
              if any(k in t for k in ("chief", "vp ", "vp,", "head of", "director", "senior director")):
                  return "Decision Maker"
              if any(k in t for k in ("senior manager", "sr. manager", "lead", "principal")):
                  return "Influencer"
              return "End User"
          def create_contact(contact, email_body, subject, emails=None, subjects=None):
              emails   = emails   or {}
