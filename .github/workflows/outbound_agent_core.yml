          def get_buying_role(title):
              t = (title or "").lower()
              if any(k in t for k in ("chief", "vp ", "vp,", "head of", "director", "senior director")):
                  return "Decision Maker"
              if any(k in t for k in ("senior manager", "sr. manager", "lead", "principal")):
                  return "Influencer"
              return "End User"
          # ═════════════════════════════════════════════════════════════
          # COMPANY ASSOCIATION
          # 2026-05-29 (JL): contacts were getting a `company` text property
          # but no link to a Company OBJECT, so "Contact → Companies" showed
          # blank in HubSpot. find_or_create_company() looks the company up by
          # exact name, creates it if missing, and caches the id for the run.
          # associate_contact_to_company() then attaches the default (primary)
          # contact↔company association via the v4 API.
          # ═════════════════════════════════════════════════════════════
          _company_cache = {}
          def find_or_create_company(name):
              if not name:
                  return None
              if name in _company_cache:
                  return _company_cache[name]
              cid = None
              try:
                  r = hs_post("/crm/v3/objects/companies/search", {
                      "filterGroups": [{"filters": [
                          {"propertyName": "name", "operator": "EQ", "value": name}
                      ]}],
                      "properties": ["name"],
                      "limit": 1,
                  })
                  results = r.get("results", [])
                  if results:
                      cid = results[0]["id"]
                      print(f"    🏢 Matched existing company: {name} → {cid}")
              except Exception as e:
                  print(f"    ⚠️ Company search error ({name}): {e}")
              if not cid:
                  try:
                      resp = hs_post("/crm/v3/objects/companies", {"properties": {"name": name}})
                      cid = resp.get("id")
                      if cid:
                          print(f"    🏢 Created company: {name} → {cid}")
                      else:
                          print(f"    ⚠️ Company create returned no id ({name}): {json.dumps(resp)[:200]}")
                  except Exception as e:
                      print(f"    ⚠️ Company create error ({name}): {e}")
              _company_cache[name] = cid
              return cid
          def associate_contact_to_company(contact_id, company_id):
              if not (contact_id and company_id):
