                  f"━━━ EMAIL 3 — Day 12 (Value) ━━━\n"
                  f"Subject: {subjects.get(3,'')}\n\n{emails.get('email_3','')}\n\n"
                  f"━━━ EMAIL 4 — Day 22 (Breakup) ━━━\n"
                  f"Subject: {subjects.get(4,'')}\n\n{emails.get('email_4','')}"
              )
              try:
                  note_resp = hs_post("/crm/v3/objects/notes", {
                      "properties": {
