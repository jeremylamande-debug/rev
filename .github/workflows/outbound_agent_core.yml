              dept        = DEPT_MAP.get(contact.get("org_type", ""), contact.get("org_type", ""))
              persona_val = contact.get("org_type", "") if contact.get("org_type", "") in ACTIVE_PERSONAS else ""
              props = {
                  "firstname":             contact["first_name"],
                  "lastname":              contact["last_name"],
                  "jobtitle":              contact["title"],
                  "company":               contact["organization"],
                  "office":                contact.get("division") or contact.get("organization", ""),
                  "ob_persona":            persona_val,
                  "city":                  (contact.get("location") or "").split(",")[0].strip(),
                  "hs_lead_status":        "NEW",
