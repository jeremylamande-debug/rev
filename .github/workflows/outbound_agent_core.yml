              try:
                  r = requests.put(
                      f"https://api.hubapi.com/crm/v4/objects/contacts/{contact_id}/associations/default/companies/{company_id}",
                      headers=HS_HEADERS,
                  )
                  ok = r.status_code in (200, 201)
                  if not ok:
                      print(f"    ⚠️ Association failed ({contact_id}→{company_id}): {r.status_code} {r.text[:120]}")
                  return ok
              except Exception as e:
                  print(f"    ⚠️ Association error: {e}")
                  return False
          def create_contact(contact, email_body, subject, emails=None, subjects=None):
              emails   = emails   or {}
