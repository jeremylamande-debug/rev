name: Daily Outbound Agent — Core (HR/ER/Compliance & Workplace Investigations)
# ═══════════════════════════════════════════════════════════════════════════
# OB Agent — Core
# ─────────────────────────────────────────────────────────────────────────────
# Sister workflow to outbound_agent.yml (the Legal/NY+MA agent). Same daily
# pattern — scrape leads, push to HubSpot, post Slack summary — but targeting
# the Core ICP instead of Law Enforcement:
#
#   Owner:           Isabella Simpatico (isabella.simpatico@rev.com)
#   Lead source:     Claude / JL OB (same value as Legal; differentiated by owner)
#   Industry whitelist: every HubSpot Industry Group EXCEPT Legal, Government,
#                       Law Enforcement (the Legal agent owns those)
#   Seed companies:  21 Fortune-class orgs with mature HR/ER/Investigations
#                    functions (Walmart, Amazon, UHG, FedEx, UPS, Home Depot,
#                    Target, Marriott, Kroger, Accenture, GE, GE Aerospace,
#                    Bloomberg, Disney, Kaiser, Walt Disney Co, Paramount,
#                    Apple, News Corp, Fox, Meta).
#   Personas (2):    HR/ER Leaders · Workplace Investigators
#                    2026-06-03 (JL): titles re-scoped per colleague feedback —
#                    err toward Employee-Relations precision over HR-generalist,
#                    and restrict "investigations" to PEOPLE / EMPLOYEE /
#                    WORKPLACE investigations only (no corporate / financial /
#                    fraud / security / ethics-compliance). HR Manager + HRBP are
#                    kept but function-gated in the find_leads SCOPE block, since
#                    which title actually runs investigations varies by org.
#   Daily volume:    25 leads/day total (HR/ER 13 · Workplace Inv 12),
#                    MAX 30 leads/company. ICP capped at Manager / Sr
#                    Manager seniority — no Director / VP / C-suite.
#   Rotation:        1 company at a time as "active". When a company is done
#                    (saturated via dupes or yield), advance to next.
#   ICP expansion:   When the seed list is exhausted, ask Claude for 5 more
#                    similar-shape companies within the industry whitelist.
#
# Persistence:
#   State (which company is active, which are exhausted, per-company counts)
#   lives in a HubSpot note marked with OUTBOUND_AGENT_STATE_CORE_V1, mirroring
#   the Legal agent's state-in-HS-notes pattern.
#
# TODOs before first push (search for `TODO_CORE` markers):
#   - ISABELLA_MEETING_LINK — confirm Isabella's HubSpot scheduler URL
#   - SEQUENCE_ID           — create a 4-email sequence in HubSpot and paste ID
#   - CONSOLIDATED_LIST_URL — create the HubSpot list (lead_source_details=JL
#                             OB AND owner=Isabella) and paste URL
# ═══════════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: '0 6 * * 1-5'  # 2:00 AM ET, Mon-Fri (matches Legal agent timing)
  workflow_dispatch:
jobs:
  run-outbound-agent-core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Run Outbound Agent (Core)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_API_KEY:   ${{ secrets.HUBSPOT_API_KEY }}
          SLACK_BOT_TOKEN:   ${{ secrets.SLACK_BOT_TOKEN }}
          GIST_TOKEN:        ${{ secrets.GIST_TOKEN }}
          GIST_ID_CORE:      ${{ secrets.GIST_ID_CORE }}
        run: |
          pip install requests pytz matplotlib --quiet
          python3 - <<'EOF'
          import requests, json, os, time, datetime, re, matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.patches as mpatches

          ANTHROPIC_KEY = os.environ["ANTHROPIC_API_KEY"]
          HUBSPOT_KEY   = os.environ["HUBSPOT_API_KEY"]
          SLACK_TOKEN   = os.environ["SLACK_BOT_TOKEN"]
          GIST_TOKEN    = os.environ.get("GIST_TOKEN", "")
          GIST_ID       = os.environ.get("GIST_ID_CORE", "")
          PORTAL_ID     = "21451281"

          # ═════════════════════════════════════════════════════════════
          # CONFIG — Core (Isabella Simpatico)
          # ═════════════════════════════════════════════════════════════
          # ── Daily lead cap ─────────────────────────────────────────
          # 2026-05-29 (JL): total daily volume capped at 25/day, split as
          # evenly as possible across the personas (was 25/persona = 75/day).
          # 2026-05-29 (JL): Compliance/Ethics persona removed — dropped to 2
          # personas and rebalanced 25/day across them.
          # Per-persona caps are now a dict keyed by persona. Each cap is
          # independent — if HR/ER saturates at 13 but Workplace Investigators
          # only finds 5, we take all 5; we don't roll over the unused quota.
          # The TOTAL_DAILY_CAP (sum below) is also enforced as a hard ceiling.
          LEADS_PER_PERSONA_PER_DAY = {
              "HR/ER Leader":           13,
              "Workplace Investigator": 12,
          }  # → 25/day total
          # 2026-05-29 (JL): per-company cap raised 20 → 30, and split evenly
          # across personas so a single company contributes a balanced mix
          # (~10 per persona) instead of 20 skewed toward whichever persona
          # filled first. A company is exhausted once it hits 30 total OR every
          # persona has hit its per-company cap / run dry. This is a LIFETIME
          # cap per company (accumulated in state across runs), not per-day.
          MAX_LEADS_PER_COMPANY             = 30  # lifetime cap per company
          # 2026-05-29 (JL): bumped 10 → 15 after dropping to 2 personas, so the
          # 30-per-company cap stays reachable with a balanced 15/15 mix.
          MAX_LEADS_PER_COMPANY_PER_PERSONA = 15  # balanced mix: 15 of each persona
          # ── Owner ─────────────────────────────────────────────────
          OWNER_NAME  = "Isabella Simpatico"
          OWNER_EMAIL = "isabella.simpatico@rev.com"
          # TODO_CORE: confirm Isabella's HubSpot scheduler URL
          MEETING_LINK = "https://meetings.hubspot.com/isabella-simpatico"
          # TODO_CORE: create the HubSpot list (filter: lead_source_details=JL OB
          # AND hubspot_owner_id=<Isabella>) and paste the list view URL here
          CONSOLIDATED_LIST_URL = f"https://app.hubspot.com/contacts/{PORTAL_ID}/objects/0-1/views/REPLACE_ME_CORE_LIST_ID/list"
          # ── Slack ─────────────────────────────────────────────────
          # 2026-06-03 (JL): tag JL on the Core summary (same member ID the Legal
          # agent uses) instead of Isabella — the Isabella placeholder was never
          # filled, so the mention rendered as literal text. Owner stays Isabella.
          SLACK_USER       = "U08JJMM2QSW"  # Jeremy Lamande
          DAILY_OB_CHANNEL = "C0AQFHD6Q4F"  # #daily-ob (same as Legal — change if Core gets its own channel)
          # ── HubSpot sequence ──────────────────────────────────────
          # TODO_CORE: create a 4-email sequence in HubSpot for Isabella and paste the numeric sequence ID
          SEQUENCE_ID = "REPLACE_ME_CORE_SEQUENCE_ID"
          # ── HTTP headers ──────────────────────────────────────────
          HS_HEADERS    = {"Authorization": f"Bearer {HUBSPOT_KEY}", "Content-Type": "application/json"}
          SLACK_HEADERS = {"Authorization": f"Bearer {SLACK_TOKEN}", "Content-Type": "application/json"}
          ANTH_HEADERS  = {
              "Content-Type":      "application/json",
              "x-api-key":         ANTHROPIC_KEY,
              "anthropic-version": "2023-06-01",
          }
          # ── Seed company list ────────────────────────────────────
          # Initial 21 companies provided by JL. The agent rotates through these
          # one at a time. When the entire seed list is exhausted, the agent
          # expands via expand_icp() — see below.
          SEED_COMPANIES = [
              "Walmart",
              "Amazon",
              "UnitedHealth Group",
              "FedEx",
              "UPS",
              "The Home Depot",
              "Target",
              "Marriott International",
              "Kroger",
              "Accenture",
              "General Electric",
              "GE Aerospace",
              "Disney",
              "Kaiser Permanente",
              "The Walt Disney Company",
              "Paramount Global",
              "Apple",
              "News Corp",
              "Fox Corporation",
              "Meta",
          ]
          # ── Exclusion list — NEVER outbound (JL 2026-06-11) ──────────
          # Companies we must never prospect into: current customers / deep
          # existing relationships. Matching is case-insensitive SUBSTRING on
          # the company name, so subsidiaries that carry the parent's name are
          # caught automatically (e.g. "Bloomberg Industry Group",
          # "Bloomberg Law", "Bloomberg BNA", "Bloomberg Government",
          # "Bloomberg Tax", "Bloomberg Media").
          #   EXCLUDED_NAME_TOKENS    → substring match on the company name.
          #   EXCLUDED_EMAIL_DOMAINS  → backstop: drop any individual lead
          #                             whose email sits on one of these
          #                             domains, even if a differently-named
          #                             subsidiary slipped past the name check.
          # To exclude another account in future, add a lowercase token here.
          EXCLUDED_NAME_TOKENS = [
              "bloomberg",            # Bloomberg L.P. + all subsidiaries — current customer
          ]
          EXCLUDED_EMAIL_DOMAINS = [
              "bloomberg.com",
              "bloomberg.net",
              "bloombergindustry.com",
              "bgov.com",
              "bna.com",
          ]
          def is_excluded_company(name):
              n = (name or "").strip().lower()
              return any(tok in n for tok in EXCLUDED_NAME_TOKENS)
          def is_excluded_email(email):
              e = (email or "").strip().lower()
              return any(e.endswith("@" + d) or e.endswith("." + d) for d in EXCLUDED_EMAIL_DOMAINS)
          # ── Industry whitelist ───────────────────────────────────
          # Used for the ICP-expansion step. We tell Claude to find similar
          # companies whose HubSpot Industry Group falls into one of these.
          # Mirrors the dropdown JL captured (minus the Legal-agent-owned
          # verticals: Legal, Government, Law Enforcement).
          INDUSTRY_WHITELIST = [
              "Consulting",
              "Content Creation",
              "Education",
              "Finance",
              "Healthcare",
              "Marketing",
              "Media",
              "Other",
              "Research",
              "Technology",
          ]
          # ── Active personas ──────────────────────────────────────
          # 2026-05-29 (JL): dropped from 3 to 2 personas — Compliance/Ethics
          # removed. Chart / email / report code is persona-count-agnostic
          # (driven by ACTIVE_PERSONAS), so removal is config-only.
          ACTIVE_PERSONAS = [
              "HR/ER Leader",
              "Workplace Investigator",
          ]
          # ── Per-persona title lists ──────────────────────────────
          # The agent passes these as search hints to Claude when scraping
          # each company. Add new titles here as you learn what works.
          # 2026-05-29 (JL): title lists rebuilt from JL's sample-titles list
          # and capped at MANAGER / SENIOR MANAGER seniority. Director, VP,
          # Head, Chief, and Officer-level titles were intentionally removed —
          # senior execs (e.g. a Chief People Officer at Walmart) don't engage
          # with cold outreach. Investigator-flavored compliance titles were
          # folded into the Workplace Investigator persona; the standalone
          # Compliance/Ethics persona was retired.
          # 2026-06-03 (JL): titles re-scoped per colleague feedback (Stephen
          # Kerner thread). Two principles:
          #   1) Err toward EMPLOYEE RELATIONS precision over HR-generalist.
          #      HR Manager / HRBP stay because they often oversee or run
          #      investigations — but they're function-gated in the find_leads
          #      prompt (only counted when their role actually covers ER cases /
          #      workplace investigations). Pure-generalist titles (e.g. People
          #      Operations Manager) were dropped.
          #   2) Investigations must be PEOPLE / EMPLOYEE / WORKPLACE
          #      investigations — NOT corporate/financial/fraud/security/ethics-
          #      compliance. Titles that bleed into corporate-investigation land
          #      (Corporate Investigator, Ethics & Compliance Investigator,
          #      Corporate Compliance Investigator, Compliance Manager, bare
          #      Internal Investigations Manager) were removed. The find_leads
          #      SCOPE block enforces this by function, since titles vary by org
          #      (e.g. at FedEx an "Employee Relations Specialist" runs employee
          #      incident investigations; elsewhere an HRBP might).
          ORG_TYPES = [
              {"type": "HR/ER Leader",
               "titles": [
                   "Employee Relations Specialist",
                   "Senior Employee Relations Specialist",
                   "Employee Relations Manager",
                   "Senior Employee Relations Manager",
                   "Employee Relations Partner",
                   "Employee Relations Consultant",
                   "Employee Relations Advisor",
                   "Human Resources Manager",
                   "HR Manager",
                   "HR Business Partner", "HRBP",
                   "Senior HR Business Partner", "Sr. HR Business Partner",
                   "Labor Relations Manager",
               ]},
              {"type": "Workplace Investigator",
               "titles": [
                   "Workplace Investigator",
                   "Senior Workplace Investigator",
                   "Workplace Investigations Manager",
                   "Employee Relations Investigator",
                   "Employee Relations Investigations Manager",
                   "HR Investigator",
                   "People Operations Investigator",
                   "Employee Conduct Investigator",
                   "Workplace Conduct Manager",
                   "Misconduct Investigator",
                   "Harassment & Discrimination Investigator",
                   "EEO Investigator",
               ]},
          ]
          # ── Persona angles ───────────────────────────────────────
          # Pain / use-case / proof used in cold emails. Hand-written for
          # Core; distinct from the Legal agent's PD/DA/Police angles.
          PERSONA_ANGLES = {
              "HR/ER Leader": {
                  "pain":     "documenting employee relations meetings, performance conversations, and exit interviews by hand while juggling 30+ active cases",
                  "use_case": "auto-transcription of employee conversations, performance reviews, and HR meeting notes. Rev transcribes them automatically with speaker labels, so the documentation for each case file mostly writes itself",
                  "proof":    "the biggest thing HR people tell us is that they can finally focus on the conversation instead of taking notes. On top of that, teams using Rev cut documentation time per case by about half, freeing up real capacity without adding headcount",
              },
              "Workplace Investigator": {
                  "pain":     "hours of witness interviews, complainant statements, and respondent testimony that all have to be transcribed manually before the report can be written",
                  "use_case": "investigator-grade transcription of interviews, recordings, and evidence with timestamped speaker labels — ready for the case file",
                  "proof":    "workplace investigations teams using Rev close cases 40% faster and reduce the interview-to-report turnaround from weeks to days",
              },
              # 2026-05-29 (JL): Compliance/Ethics persona + angle removed.
          }
          # ── Copy guidance (JL 2026-06-09) ─────────────────────────
          # Wording + emphasis rules baked into every generated email & subject.
          # Lead benefit: HR people get to focus on the conversation, not notes.
          COPY_GUIDE = (
              "Wording and emphasis rules: "
              "lead with the benefit that HR people can focus on the conversation instead of taking notes "
              "(Rev transcribes automatically with speaker labels, so the documentation for each case file mostly writes itself). "
              "Say 'investigation' not 'care'. Say 'employee conversation' not 'intake call'. Use 'HR' not 'ER'."
          )
          # Dept-map used in note bodies and the chart legend.
          DEPT_MAP = {
              "HR/ER Leader":           "HR / Employee Relations",
              "Workplace Investigator": "Workplace Investigations",
          }
          print(f"🎯 Active personas ({len(ACTIVE_PERSONAS)}): {ACTIVE_PERSONAS}")
          print(f"📍 Seed companies: {len(SEED_COMPANIES)}")
          print(f"👤 Owner: {OWNER_NAME} ({OWNER_EMAIL})")
          _cap_str = ", ".join(f"{p}:{LEADS_PER_PERSONA_PER_DAY[p]}" for p in ACTIVE_PERSONAS)
          print(f"📊 Daily cap: {sum(LEADS_PER_PERSONA_PER_DAY.values())} total/day ({_cap_str}) — {MAX_LEADS_PER_COMPANY}/company max")
          # ═════════════════════════════════════════════════════════════
          # HUBSPOT HELPERS
          # ═════════════════════════════════════════════════════════════
          def hs_get(path):
              r = requests.get(f"https://api.hubapi.com{path}", headers=HS_HEADERS)
              return r.json()
          def hs_post(path, payload):
              r = requests.post(f"https://api.hubapi.com{path}", headers=HS_HEADERS, json=payload)
              return r.json()
          # ── Resolve Isabella's HubSpot owner ID ──────────────────
          owners = hs_get("/crm/v3/owners").get("results", [])
          owner_id = None
          for o in owners:
              if o.get("email", "").lower() == OWNER_EMAIL.lower():
                  owner_id = o["id"]
                  break
          if not owner_id:
              for o in owners:
                  full = f"{o.get('firstName','')} {o.get('lastName','')}".strip()
                  if full.lower() == OWNER_NAME.lower():
                      owner_id = o["id"]
                      break
          if not owner_id:
              raise RuntimeError(f"❌ Could not find HubSpot owner for {OWNER_NAME} ({OWNER_EMAIL}). Verify owner exists.")
          print(f"✅ Resolved owner: {OWNER_NAME} → ID {owner_id}")
          LEADSOURCE_VALUE = "Claude"
          LEAD_SOURCE_DETAILS = "JL OB"  # same value Legal uses — distinguished by owner
          # ═════════════════════════════════════════════════════════════
          # HUBSPOT PROPERTY SETUP
          # Ensures `office` and `persona` properties exist on Contact.
          # (Same props as Legal — already created by the Legal agent / Office
          # Backfill workflow; 409 = exists, harmless.)
          # ═════════════════════════════════════════════════════════════
          CORE_PROPS = [
              {
                  "name":        "office",
                  "label":       "Office",
                  "description": "Specific office / org / division the contact belongs to (e.g. 'Meta People Operations — NYC', 'Disney HR Investigations'). Populated automatically.",
                  "type":        "string",
                  "fieldType":   "text",
              },
              {
                  # 2026-05-29: renamed from `persona`/`Persona` to
                  # `ob_persona`/`OB Persona` because another property in
                  # this HubSpot portal already owns the label "Persona",
                  # blocking creation of a contact property with that label.
                  "name":        "ob_persona",
                  "label":       "OB Persona",
                  "description": "Which OB agent persona this contact belongs to. Legal: Public Defender / District Attorney / Police-Sheriff Investigators. Core: HR/ER Leader / Workplace Investigator.",
                  "type":        "enumeration",
                  "fieldType":   "select",
                  "options": [
                      # Legal personas
                      {"label": "Public Defender",              "value": "Public Defender",              "displayOrder": 0},
                      {"label": "District Attorney",            "value": "District Attorney",            "displayOrder": 1},
                      {"label": "Police/Sheriff Investigators", "value": "Police/Sheriff Investigators", "displayOrder": 2},
                      # Core personas
                      {"label": "HR/ER Leader",                 "value": "HR/ER Leader",                 "displayOrder": 3},
                      {"label": "Workplace Investigator",       "value": "Workplace Investigator",       "displayOrder": 4},
                      # 2026-05-29 (JL): Compliance/Ethics persona retired.
                  ],
              },
          ]
          # 2026-05-29: PATCH-on-409 pattern. The original code treated
          # 409 (property already exists) as success, but POST is a NO-OP
          # when the property exists — HubSpot does NOT merge new enum
          # options into the existing property. Result: when Legal agent
          # created `ob_persona` with 3 Legal options, Core's POST returned
          # 409 and the 3 Core options never got added. Every Core contact
          # then failed with INVALID_OPTION. Fix: on 409 for an enum
          # property, follow up with PATCH to sync the full options list.
          for prop in CORE_PROPS:
              try:
                  body = {
                      "name":        prop["name"],
                      "label":       prop["label"],
                      "description": prop["description"],
                      "type":        prop["type"],
                      "fieldType":   prop["fieldType"],
                      "groupName":   "contactinformation",
                  }
                  if "options" in prop:
                      body["options"] = prop["options"]
                  r = requests.post(
                      "https://api.hubapi.com/crm/v3/properties/contacts",
                      headers=HS_HEADERS,
                      json=body,
                  )
                  status = r.status_code
                  if status in (200, 201):
                      print(f"  ✅ Property created: {prop['name']} ({status})")
                  elif status == 409:
                      # Property exists. If it's an enumeration, PATCH to
                      # ensure all expected options are present (HubSpot
                      # won't merge them via POST).
                      if prop.get("type") == "enumeration" and "options" in prop:
                          patch_body = {"options": prop["options"]}
                          rp = requests.patch(
                              f"https://api.hubapi.com/crm/v3/properties/contacts/{prop['name']}",
                              headers=HS_HEADERS,
                              json=patch_body,
                          )
                          if rp.status_code in (200, 201):
                              print(f"  🔄 Property options synced: {prop['name']} ({rp.status_code}, {len(prop['options'])} values)")
                          else:
                              print(f"  ⚠️ Property options sync failed ({prop['name']}): {rp.status_code} {rp.text[:120]}")
                      else:
                          print(f"  ✅ Property ready: {prop['name']} (409, no sync needed)")
                  else:
                      print(f"  ⚠️ Property create issue ({prop['name']}): {status} {r.text[:120]}")
              except Exception as e:
                  print(f"  ⚠️ Property setup error ({prop['name']}): {e}")
          # ═════════════════════════════════════════════════════════════
          # STATE MANAGEMENT
          # State shape:
          #   {
          #     "company":         "Walmart",           # current active
          #     "exhausted":       ["Apple", ...],      # saturated companies
          #     "company_leads":   {"Walmart": 12, ...},# per-company lead counts
          #     "empty_passes":    {"Walmart": 1, ...}, # consecutive all-dupe runs
          #     "zero_lead_attempts": {"Walmart": 0, ...},
          #     "expanded_companies": ["Stripe", ...],  # ICP-expansion picks
          #   }
          # ═════════════════════════════════════════════════════════════
          STATE_MARKER = "OUTBOUND_AGENT_STATE_CORE_V1"
          def load_state():
              try:
                  resp = hs_post("/crm/v3/objects/notes/search", {
                      "filterGroups": [{"filters": [
                          {"propertyName": "hs_note_body", "operator": "CONTAINS_TOKEN", "value": STATE_MARKER}
                      ]}],
                      "properties": ["hs_note_body", "hs_timestamp"],
                      "sorts":      [{"propertyName": "hs_timestamp", "direction": "DESCENDING"}],
                      "limit":      1,
                  })
                  results = resp.get("results", [])
                  if results:
                      body = results[0]["properties"]["hs_note_body"]
                      json_str = body.split(STATE_MARKER)[1].strip()
                      return json.loads(json_str)
              except Exception as e:
                  print(f"State load error: {e}")
              return None
          def save_state(state):
              try:
                  hs_post("/crm/v3/objects/notes", {
                      "properties": {
                          "hs_note_body": f"{STATE_MARKER}\n{json.dumps(state)}",
                          "hs_timestamp": str(int(datetime.datetime.now().timestamp() * 1000)),
                      }
                  })
              except Exception as e:
                  print(f"State save error: {e}")
          def init_state():
              return {
                  "company":              SEED_COMPANIES[0],
                  "exhausted":            [],
                  "company_leads":        {},
                  "company_persona_leads": {},  # {company: {persona: count}}
                  "empty_passes":         {},
                  "zero_lead_attempts":   {},
                  "expanded_companies": [],
              }
          def all_companies(state):
              """Seed list + any expansion picks. Order: seed first, then expansion.
              Excluded companies (current customers, e.g. Bloomberg) are filtered
              out here so the rotation can never select them."""
              combined = SEED_COMPANIES + state.get("expanded_companies", [])
              return [c for c in combined if not is_excluded_company(c)]
          def next_company(state, skip=None):
              exhausted_self = set(state.get("exhausted", []))
              skip_set = {skip} if skip else set()
              for c in all_companies(state):
                  if c not in exhausted_self and c not in skip_set:
                      return c
              return None
          # ═════════════════════════════════════════════════════════════
          # CLAUDE HELPER — identical retry/backoff to the Legal agent
          # ═════════════════════════════════════════════════════════════
          def claude(prompt, max_tokens=1000, use_search=False, max_retries=4):
              body = {
                  "model":      "claude-sonnet-4-6",
                  "max_tokens": max_tokens,
                  "messages":   [{"role": "user", "content": prompt}],
              }
              if use_search:
                  body["tools"] = [{"type": "web_search_20250305", "name": "web_search"}]
              last_err = None
              for attempt in range(max_retries):
                  try:
                      resp = requests.post(
                          "https://api.anthropic.com/v1/messages",
                          headers=ANTH_HEADERS, json=body, timeout=120,
                      )
                      if resp.status_code in (429, 529) or resp.status_code >= 500:
                          retry_after = resp.headers.get("retry-after")
                          delay = float(retry_after) if retry_after else (2 ** attempt) * 5
                          print(f"    ⏳ Claude API {resp.status_code} (attempt {attempt+1}/{max_retries}) — sleeping {delay}s")
                          time.sleep(delay)
                          last_err = f"HTTP {resp.status_code}: {resp.text[:200]}"
                          continue
                      if resp.status_code >= 400:
                          raise RuntimeError(f"Claude API {resp.status_code}: {resp.text[:300]}")
                      data = resp.json()
                      text = "".join(
                          b.get("text", "") for b in data.get("content", [])
                          if b.get("type") == "text"
                      ).strip()
                      if not text:
                          print(f"    ⚠️ Empty Claude response (attempt {attempt+1}/{max_retries}) — retrying")
                          time.sleep((2 ** attempt) * 3)
                          last_err = "empty content"
                          continue
                      return text
                  except (requests.exceptions.Timeout, requests.exceptions.ConnectionError) as e:
                      last_err = f"network: {e}"
                      print(f"    ⚠️ Claude API network error (attempt {attempt+1}/{max_retries}): {e}")
                      time.sleep((2 ** attempt) * 3)
              raise RuntimeError(f"Claude API exhausted {max_retries} retries — last error: {last_err}")
          # ═════════════════════════════════════════════════════════════
          # ICP EXPANSION
          # When the seed list is exhausted, asks Claude for 5 more companies
          # similar in shape (large HR/ER/Investigations functions) within the
          # industry whitelist. Picks are appended to state["expanded_companies"]
          # so they persist across runs.
          # ═════════════════════════════════════════════════════════════
          def expand_icp(state, k=5):
              already = set(all_companies(state))
              prompt = f"""You are a B2B sales-intel analyst. Recommend {k} more US-based companies
          we should prospect into for selling Rev's enterprise transcription software (~$15k-50k/yr) to
          their HR/Employee Relations and Workplace Investigations teams.
          Constraints:
          - Public or large private companies (5,000+ employees)
          - Industry MUST fall in one of: {", ".join(INDUSTRY_WHITELIST)}
          - DO NOT include Legal services firms, Government agencies, or Law Enforcement
            (those are handled by a separate agent)
          - DO NOT recommend Bloomberg or ANY Bloomberg subsidiary / affiliate
            (Bloomberg L.P., Bloomberg Industry Group, Bloomberg Law, Bloomberg BNA,
            Bloomberg Government, Bloomberg Tax, Bloomberg Media) — they are an
            existing customer and must never be outbounded
          - Must have a known internal HR / Employee Relations / Investigations function
          - DO NOT recommend any of these already-prospected companies: {", ".join(sorted(already))}
          Return ONLY a JSON array of {k} company names (strings), nothing else.
          Example: ["Stripe", "Salesforce", "Spotify", "Goldman Sachs", "Procter & Gamble"]"""
              try:
                  raw = claude(prompt, max_tokens=400, use_search=True)
                  for attempt in [
                      lambda t: json.loads(t.strip()),
                      lambda t: json.loads(t[t.find("["):t.rfind("]")+1]),
                  ]:
                      try:
                          result = attempt(raw)
                          if isinstance(result, list):
                              # De-dupe + drop empties + drop already-known + drop excluded
                              clean = [c.strip() for c in result
                                       if isinstance(c, str) and c.strip()
                                       and c.strip() not in already
                                       and not is_excluded_company(c)]
                              return clean[:k]
                      except Exception:
                          continue
                  print(f"  ⚠️ ICP expansion: couldn't parse response (first 200 chars): {raw[:200]!r}")
                  return []
              except Exception as e:
                  print(f"  ⚠️ ICP expansion error: {e}")
                  return []
          # ═════════════════════════════════════════════════════════════
          # FIND LEADS — given a company + persona, surface real people
          # Scrapes website + LinkedIn via Claude web_search.
          # ═════════════════════════════════════════════════════════════
          def find_leads(company, org_type, titles, exclude_names=None, batch=1):
              exclude_str = ""
              if exclude_names:
                  sample = exclude_names[:30]
                  exclude_str = f"\nDo NOT return these people (already found): {', '.join(sample)}\nFind different people beyond this list."
              batch_str = ""
              if batch > 1:
                  batch_str = (
                      f"\nThis is search batch {batch} — find people not already captured in previous searches. "
                      f"Look deeper: LinkedIn profiles, corporate org charts, press releases, internal job boards, "
                      f"and the company's careers / leadership pages."
                  )
              prompt = f"""Search for real {org_type} staff at {company}.
          Find people with these titles (or close variants): {', '.join(titles)}
          Look at official corporate websites, LinkedIn, press releases, leadership pages,
          and public org-chart data. {company} is a large enterprise — find as many real
          people as possible. Aim for 15-25 contacts.
          SCOPE — CRITICAL (judge by what the person actually DOES, not the title text):
          We ONLY want people whose real work is EMPLOYEE RELATIONS and PEOPLE /
          EMPLOYEE / WORKPLACE INVESTIGATIONS — workplace misconduct, harassment,
          discrimination, retaliation, EEO, policy violations, and employee
          complaints/grievances. Titles for this work vary a lot by company, so
          use the title only as a hint and confirm the function:
          - At some orgs an "Employee Relations Specialist" runs the workplace
            investigations; at others an "HR Business Partner" or "HR Manager"
            does, or they manage the people who do. Include HR Manager / HRBP
            ONLY when their role clearly covers ER cases or workplace
            investigations — not generic HR generalists (benefits, recruiting,
            onboarding, comp, HRIS).
          - Prefer Employee-Relations-specific roles over broad HR-generalist roles.
          EXCLUDE — do NOT return people who run NON-people investigations, even if
          their title contains "Investigator", "Investigations", or "Compliance":
          - Corporate / financial / fraud investigations, internal audit, SIU
          - Security, loss prevention, asset protection, physical/cyber security
          - Regulatory, ethics-hotline, or compliance investigations that are
            financial or business-conduct (not employee-conduct) in nature
          - Claims, insurance, or background-check investigators
          If you cannot confirm a person's work is employee/people/workplace-
          focused, leave them out.
          SENIORITY — IMPORTANT: target individual contributors through Senior Manager
          level only (Specialists, Coordinators, Analysts, HRBPs, Investigators, Managers,
          Senior Managers). Do NOT return Directors, Senior Directors, VPs, Heads,
          Chiefs, or any C-suite — they don't engage with cold outreach.{exclude_str}{batch_str}
          Return a JSON array. Each item must have these exact keys:
          first_name, last_name, title, organization, division, location, org_type, website, linkedin, email, phone
          - `organization` MUST be "{company}" (the parent org)
          - `division` is the specific business unit / region / function if discoverable
            (e.g. "People Operations — NYC", "Corporate Investigations", "Global Compliance"),
            otherwise empty string
          - `location` is the city/state/country if discoverable
          - `org_type` MUST be "{org_type}"
          - `linkedin` is the public LinkedIn profile URL if you can find it, else ""
          - `email` and `phone` only if publicly findable
          Example:
          [
            {{
              "first_name": "Jane", "last_name": "Smith", "title": "Senior HR Business Partner",
              "organization": "{company}", "division": "Corporate HQ",
              "location": "Bentonville, AR", "org_type": "{org_type}",
              "website": "", "linkedin": "https://www.linkedin.com/in/jane-smith-hrbp/",
              "email": "", "phone": ""
            }}
          ]

          OUTPUT FORMAT — CRITICAL:
          - Do NOT write any preamble like "Now I have enough data" or "Let me compile the JSON" or "Based on my research"
          - Do NOT write any commentary, analysis, or summary before or after the JSON
          - Your ENTIRE response must be ONE JSON array: starts with `[`, ends with `]`, nothing else
          - The JSON array MUST be complete — do not truncate mid-object. If you only have N solid leads, return N — don't pad.
          - If you must think, do it silently via web_search calls — do NOT think in your text output"""
              # 2026-05-29: max_tokens 4000 → 8000 to give the model room
              # to emit the full JSON array after its (suppressed-but-still-
              # occurring) research preamble. Same fix applied to Legal agent.
              text = claude(prompt, max_tokens=8000, use_search=True)
              print(f"    Raw response (first 200 chars): {text[:200]}")
              # 2026-05-29: brace-depth-aware extraction. Same helper as
               # Legal agent — walks the string tracking `[`/`]` depth (with
              # string-quote awareness) and returns the first balanced block.
              def _clean(t):
                  return t.replace("```json","").replace("```","").strip()
              def _extract_balanced(t, open_ch="[", close_ch="]"):
                  start = t.find(open_ch)
                  if start < 0:
                      return None
                  depth = 0
                  in_str = False
                  esc = False
                  for i in range(start, len(t)):
                      ch = t[i]
                      if esc:
                          esc = False
                          continue
                      if ch == "\\":
                          esc = True
                          continue
                      if ch == '"':
                          in_str = not in_str
                          continue
                      if in_str:
                          continue
                      if ch == open_ch:
                          depth += 1
                      elif ch == close_ch:
                          depth -= 1
                          if depth == 0:
                              return t[start:i+1]
                  return None
              for attempt in [
                  lambda t: json.loads(_clean(t)),
                  lambda t: json.loads(_extract_balanced(_clean(t), "[", "]")),
                  lambda t: json.loads(_clean(t)[_clean(t).find("["):_clean(t).rfind("]")+1]),
              ]:
                  try:
                      result = attempt(text)
                      if isinstance(result, list):
                          for lead in result:
                              if isinstance(lead, dict):
                                  lead["org_type"]     = org_type
                                  lead["organization"] = company
                          print(f"    Parsed {len(result)} leads")
                          return result
                  except Exception:
                      pass
              print(f"    ⚠️ Could not parse JSON")
              return []
          # ═════════════════════════════════════════════════════════════
          # DEDUP CHECK
