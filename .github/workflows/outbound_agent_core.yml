          def enroll_in_sequence(contact_id, contact_email):
              # TODO_CORE: enable once SEQUENCE_ID is set
              if not SEQUENCE_ID or SEQUENCE_ID.startswith("REPLACE_ME"):
                  print(f"    ⚠️ SEQUENCE_ID not set — skipping enrollment")
